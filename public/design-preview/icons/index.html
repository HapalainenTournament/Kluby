<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>POSTGAME Badge Icons</title><style>
:root{--bg:#0A1120;--card:#0F1A2B;--border:rgba(255,255,255,.08);--cyan:#2DD4BF;--green:#34D399;--red:#F43F5E;--gold:#FBBF24;--muted:#8FA1B8;--text:#F8FAFC}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:14px/1.4 Inter,ui-sans-serif,system-ui;padding:32px}.wrap{max-width:1180px;margin:auto}.kicker{font-size:10px;letter-spacing:.13em;font-weight:900;color:var(--cyan)}h1{margin:6px 0 8px;font-size:30px}p{color:var(--muted);margin:0 0 24px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px}.card{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:18px}.head{display:flex;justify-content:space-between;gap:12px;align-items:flex-start;margin-bottom:18px}.head b{font-size:13px}.head small{display:block;color:var(--muted);font-size:10px;margin-top:2px}.sizes{display:flex;align-items:end;gap:18px;min-height:62px}.demo{display:grid;gap:5px;justify-items:center;color:var(--tone,var(--cyan))}.demo span{font-size:8px;color:var(--muted)}.badge-duotone{opacity:.22}.cyan{--tone:var(--cyan)}.green{--tone:var(--green)}.gold{--tone:var(--gold)}.red{--tone:var(--red)}.muted{--tone:#8FA1B8}@media(max-width:600px){body{padding:16px}.grid{grid-template-columns:1fr 1fr}.card{padding:13px}.sizes{gap:10px}}
</style></head><body><main class="wrap"><span class="kicker">DESIGN PREVIEW · BADGE ICONS</span><h1>POSTGAME badge system</h1><p>Custom 24×24 stroke icons. Preview only. Not wired into production cards yet.</p><section id="icons" class="grid"></section></main><script type="module">
import {BadgeIcon} from '/icons/badges/index.js';
const defs=[
 ['goalkeeper','Goalkeeper','Position','green'],['defender','Defender','Position','gold'],['midfielder','Midfielder','Position','cyan'],['forward','Forward','Position','red'],
 ['topScorer','Top Scorer','Key Threats','cyan'],['clinical','Clinical','Key Threats','green'],['creator','Creator','Key Threats','cyan'],['defensive','Defensive','Key Threats','gold'],
 ['mvp','MVP / Top Rated','Future / performance','gold'],['ironMan','Iron Man / The OG','Most matches','cyan'],['goalkeeperWall','Goalkeeper / Wall','Future defensive badge','green'],
 ['miss','Most Likely to Miss','Superlatives','red'],['sentOff','Most Likely to Get Sent Off','Superlatives','red'],['backpack','The Backpack','Superlatives','cyan'],['architect','The Architect','Superlatives','green'],
 ['featureClubStats','Club stats & form','Homepage feature','cyan'],['featurePlayerAnalytics','Player cards & analytics','Homepage feature','green'],['featureSessions','Sessions & misc stats','Homepage feature','gold'],['creativity','Creativity ranking','Players','cyan'],
 ['ghost','Ghost','Fun rankings','muted'],['lMerchant','L Merchant','Fun rankings','red'],['selfGlazer','Self-Glazer','Fun rankings','gold'],['mainCharacter','Main Character','Superlatives / rankings','gold']
];
const host=document.querySelector('#icons');host.innerHTML=defs.map(([id,label,where,tone])=>`<article class="card ${tone}"><div class="head"><div><b>${label}</b><small>${where}</small></div>${BadgeIcon(id,{size:24})}</div><div class="sizes">${[16,24,48].map(s=>`<div class="demo">${BadgeIcon(id,{size:s})}<span>${s}px</span></div>`).join('')}</div></article>`).join('');
</script></body></html>
