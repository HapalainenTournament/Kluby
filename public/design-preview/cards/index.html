<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Clubroom Card Preview</title><script type="module" src="/cards/player-card.js"></script><script type="module" src="/cards/duo-card.js"></script><style>
body{margin:0;background:#0A1120;color:#eef6ff;font-family:Inter,Manrope,system-ui,sans-serif}.wrap{max-width:1500px;margin:auto;padding:32px}.k{color:#2DD4BF;font-size:12px;font-weight:900;letter-spacing:.14em}.section{margin-top:34px}.sizes{display:flex;gap:28px;align-items:flex-start;flex-wrap:wrap;margin-top:22px}.case{background:#0F1A2B;border:1px solid rgba(255,255,255,.08);border-radius:24px;padding:18px}.case h2{font-size:14px;margin:0 0 14px;color:#94a3b8}.s160{width:160px}.s300{width:300px}.s500{width:500px}.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:16px}button{border:0;border-radius:999px;padding:10px 16px;background:#2DD4BF;color:#07101b;font-weight:900;cursor:pointer}.note{color:#94a3b8;font-size:13px;line-height:1.5}.duoGrid{display:grid;grid-template-columns:repeat(3,minmax(280px,1fr));gap:24px;margin-top:24px}.stage{max-width:420px;margin:auto}@media(max-width:700px){.wrap{padding:18px}.s500{width:min(500px,100%)}.sizes{gap:18px}.duoGrid{grid-template-columns:1fr}}
</style></head><body><div class="wrap"><div class="k">DESIGN PREVIEW · CARDS</div><h1>PlayerCard scale calibration</h1><p class="note">The same card is rendered at 160 px, 300 px and 500 px. Add <b>?debug=card</b> to drag/resize slots and use <b>Copy layout</b>.</p><div class="sizes">
<div class="case"><h2>160 px</h2><div class="s160"><player-card id="pc160"></player-card></div></div>
<div class="case"><h2>300 px</h2><div class="s300"><player-card id="pc300"></player-card></div></div>
<div class="case"><h2>500 px</h2><div class="s500"><player-card id="pc500"></player-card></div></div>
</div><div class="actions"><button id="export300">Export 300 px card PNG</button></div>
<div class="section"><div class="k">DUO CARD</div><div class="duoGrid">
<div class="case"><h2>Hero enabled</h2><div class="stage"><duo-card id="duo1"></duo-card></div></div>
<div class="case"><h2>Long names</h2><div class="stage"><duo-card id="duo2"></duo-card></div></div>
<div class="case"><h2>Missing data · hero off</h2><div class="stage"><duo-card id="duo3"></duo-card></div></div>
</div></div></div><script type="module">
await Promise.all([customElements.whenDefined('player-card'),customElements.whenDefined('duo-card')]);
const attrs={
 'player-id':'preview-player','player-name':'PLAYER','position':'FWD','overall':'77','jersey-color':'#587aa5',
 'stat-1-label':'RAT','stat-1-value':'7.0','stat-2-label':'G+A/G','stat-2-value':'1.00','stat-3-label':'G/G','stat-3-value':'0.83',
 'stat-4-label':'A/G','stat-4-value':'0.17','stat-5-label':'PASS','stat-5-value':'67.0%','stat-6-label':'SHOT','stat-6-value':'21.0%',
 'matches':'6','goals':'5','assists':'1','motm':'0','player-image':'/cards/players/default.png'
};
for(const id of ['pc160','pc300','pc500']){const el=document.getElementById(id);for(const [k,v] of Object.entries(attrs))el.setAttribute(k,v)}
document.getElementById('export300').addEventListener('click',()=>document.getElementById('pc300').exportPng());
const set=(id,a,b,stats,config)=>{const el=document.getElementById(id);el.playerA=a;el.playerB=b;el.duoStats=stats;if(config)el.config=config;};
set('duo1',{name:'NOVA',overall:89,position:'ST',stats:[{value:8.44},{value:.91},{value:.42}]},{name:'ORBIT',overall:87,position:'CAM',stats:[{value:8.18},{value:.37},{value:.79}]},{a:{avgRating:8.44,goalsPerGame:.91,assistsPerGame:.42},b:{avgRating:8.18,goalsPerGame:.37,assistsPerGame:.79},shared:{sharedMatches:38,combinedGoals:49,linkUps:17,combinedMotm:11},hero:{value:17,label:'LINK-UPS'}});
set('duo2',{name:'ALEXANDER NIGHTFALL',overall:91,position:'CM'},{name:'CHRISTOPHER VALENTINE',overall:90,position:'CDM'},{a:{avgRating:8.31,goalsPerGame:.22,assistsPerGame:.64},b:{avgRating:8.29,goalsPerGame:.18,assistsPerGame:.51},shared:{sharedMatches:64,combinedGoals:26,linkUps:21,combinedMotm:13},hero:{value:21,label:'LINK-UPS'}});
set('duo3',{name:'PLAYER A',position:'LB'},{name:'PLAYER B',overall:82,position:'CB'},{a:{avgRating:null,goalsPerGame:null,assistsPerGame:.15},b:{avgRating:7.44,goalsPerGame:null,assistsPerGame:null},shared:{sharedMatches:9,combinedGoals:null,linkUps:null,combinedMotm:1}},{sideStats:[{key:'avgRating',label:'AVG RAT',format:'rating',highlightBetter:true},{key:'goalsPerGame',label:'G/G',format:'decimal2',highlightBetter:true},{key:'assistsPerGame',label:'A/G',format:'decimal2',highlightBetter:true}],hero:{enabled:false,key:'linkUps',label:'LINK-UPS'},sharedStats:[{key:'sharedMatches',label:'MATCHES',format:'integer'},{key:'combinedGoals',label:'GOALS',format:'integer'},{key:'linkUps',label:'LINK-UPS',format:'integer'},{key:'combinedMotm',label:'MOTM',format:'integer'}],highlightBetter:true,aliases:{}});
</script></body></html>
