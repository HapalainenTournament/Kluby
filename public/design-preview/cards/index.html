<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PlayerCard Tier Preview</title><script type="module" src="/cards/player-card.js"></script><style>
:root{font-family:Inter,system-ui,sans-serif;color:#e5eef7;background:#07101b}*{box-sizing:border-box}body{margin:0;padding:32px;background:radial-gradient(circle at 50% 0,#10243b 0,#07101b 46%,#04080d 100%);min-height:100vh}.wrap{max-width:1500px;margin:auto}.head{display:flex;gap:18px;align-items:center;justify-content:space-between;flex-wrap:wrap;margin-bottom:28px}.head h1{margin:0}.controls{display:flex;gap:12px;align-items:center;flex-wrap:wrap}.controls label{font-size:13px;color:#94a3b8}.controls input{width:52px;height:34px;border:0;background:none}.grid{display:grid;grid-template-columns:repeat(4,minmax(220px,1fr));gap:24px}.item h2{text-align:center;text-transform:capitalize;font-size:15px;letter-spacing:.08em;color:#94a3b8}.exportBtn{display:block;margin:12px auto 0;border:1px solid rgba(255,255,255,.16);background:#0f1a2b;color:#e5eef7;border-radius:999px;padding:9px 14px;font-weight:800;cursor:pointer}.exportBtn:hover{border-color:#2dd4bf;color:#5eead4}.exportBtn:disabled{opacity:.5;cursor:wait}.status{font-size:12px;color:#94a3b8;min-height:18px;text-align:center;margin-top:8px}.item player-card{width:100%;max-width:320px;margin:auto}.tests{margin-top:42px;display:grid;grid-template-columns:repeat(2,minmax(240px,320px));gap:24px}.tests h2{grid-column:1/-1}@media(max-width:1050px){.grid{grid-template-columns:repeat(2,1fr)}}@media(max-width:560px){body{padding:16px}.grid{grid-template-columns:1fr}.tests{grid-template-columns:1fr}}
</style></head><body><div class="wrap"><div class="head"><div><h1>PlayerCard tiers</h1><p>Same geometry, different tier styling.</p></div><div class="controls"><label>Jersey color <input id="jersey" type="color" value="#4f83ff"></label></div></div><div class="grid" id="grid"></div><div class="tests"><h2>Edge cases</h2><player-card tier="special" player-name="A Very Long Clubroom Player Name" position="FWD" overall="94" jersey-color="#8b5cf6" stat-1-label="RAT" stat-1-value="8.9" stat-2-label="G+A/G" stat-2-value="1.75" stat-3-label="G/G" stat-3-value="1.10" stat-4-label="A/G" stat-4-value="0.65" stat-5-label="PASS" stat-5-value="82.4%" stat-6-label="SHOT" stat-6-value="31.2%" matches="42" goals="46" assists="27" motm="11"></player-card><player-card tier="bronze" player-name="Missing Data" position="--" overall="" jersey-color="#d9dde3" stat-1-label="RAT" stat-2-label="G+A/G" stat-3-label="G/G" stat-4-label="A/G" stat-5-label="PASS" stat-6-label="SHOT"></player-card></div></div><script type="module">
const tiers=[['bronze',65],['silver',75],['gold',85],['special',94]];const grid=document.querySelector('#grid');
function card(tier,ovr){return `<div class="item"><h2>${tier} · OVR ${ovr}</h2><player-card tier="${tier}" player-name="PursuiitCZ" position="FWD" overall="${ovr}" jersey-color="#4f83ff" stat-1-label="RAT" stat-1-value="8.1" stat-2-label="G+A/G" stat-2-value="1.24" stat-3-label="G/G" stat-3-value="0.35" stat-4-label="A/G" stat-4-value="0.89" stat-5-label="PASS" stat-5-value="73.6%" stat-6-label="SHOT" stat-6-value="34.0%" matches="37" goals="13" assists="33" motm="10"></player-card><button class="exportBtn" type="button">Export PNG</button><div class="status"></div></div>`}grid.innerHTML=tiers.map(x=>card(...x)).join('');document.querySelector('#jersey').addEventListener('input',e=>document.querySelectorAll('player-card').forEach(c=>c.setAttribute('jersey-color',e.target.value)));document.querySelectorAll('.exportBtn').forEach(btn=>btn.addEventListener('click',async()=>{const item=btn.closest('.item');const card=item.querySelector('player-card');const status=item.querySelector('.status');btn.disabled=true;status.textContent='Rendering…';try{const blob=await card.exportPng({width:1200,height:1800});status.textContent=`Exported ${(blob.size/1024).toFixed(0)} KB`;}catch(e){console.error(e);status.textContent='Export failed';}finally{btn.disabled=false}}));
</script></body></html>
