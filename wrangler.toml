# POSTGAME · Cloudflare Workers config (v103)
name = "postgame"
main = "worker.js"
compatibility_date = "2025-09-15"
compatibility_flags = ["nodejs_compat"]

# Everything in ./public is served straight from Cloudflare's edge.
# These paths go to the Worker first because it injects ads/preview tags or fills in the legal page.
[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = ["/", "/index.html", "/legal", "/legal.html", "/pass/checkout", "/pass/checkout.html", "/api/*", "/og/*", "/club/*"]

# Postgres (Neon) through Hyperdrive. Create it with:
#   npx wrangler hyperdrive create postgame-db --connection-string="postgres://…neon.tech/neondb?sslmode=require"
# then paste the id below.
[[hyperdrive]]
binding = "HYPERDRIVE"
id = "PASTE_HYPERDRIVE_ID_HERE"
localConnectionString = "postgres://postgres@localhost:5499/postgres"

# Archive collector + Discord session reports every 5 minutes.
[triggers]
crons = ["*/5 * * * *"]

[vars]
PUBLIC_URL = "https://postgame.gg"
OWNER_CLUB_IDS = "142426"
COLLECTOR_BATCH = "8"
CLUB_TZ = "Europe/Prague"

[observability]
enabled = true

[[rules]]
type = "Data"
globs = ["**/*.ttf", "**/*.png"]
fallthrough = true
